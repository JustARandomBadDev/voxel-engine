name: Vulkan C++ CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Linux deps
      # -------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxext-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      # -------------------------
      # Windows deps
      # -------------------------
      - name: Setup Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.3.296.0"
          $installer = "$env:TEMP\VulkanSDK-Installer.exe"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" `
            -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin"       >> $env:GITHUB_PATH

      # -------------------------
      # Configure
      # -------------------------
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --config Release

      # -------------------------
      # Package (Linux)
      # -------------------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/MinecraftVulkan package/
          cp -r res package/

      # -------------------------
      # Package (Windows)
      # -------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build\Release\MinecraftVulkan.exe package\
          Copy-Item -Recurse res package\

      # -------------------------
      # Upload artifact
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftVulkan-${{ runner.os }}
          path: package/
          retention-days: 7